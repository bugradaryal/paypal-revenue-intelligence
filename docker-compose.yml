# Yerel geliştirme veritabanı. Başlat: docker compose up -d
# pgvector imajı standart PostgreSQL'in birebir üst kümesidir (semantic cache için hazır).
services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: pri-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pri}
      POSTGRES_USER: ${POSTGRES_USER:-pri}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD .env dosyasında tanımlı olmalı}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pri_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pri_pgdata:
