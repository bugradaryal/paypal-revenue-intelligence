# Yerel API + PostgreSQL geliştirme ortamı. Başlat: docker compose up --build -d
# Render'da API Docker Web Service, veritabanı ise Render Managed PostgreSQL olarak çalışır.
services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: pri-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pri}
      POSTGRES_USER: ${POSTGRES_USER:-pri}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD .env dosyasında tanımlı olmalı}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pri_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    container_name: pri-api
    build:
      context: ./backend
      dockerfile: src/PRI.Api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-pri};Username=${POSTGRES_USER:-pri};Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD .env dosyasında tanımlı olmalı}"
      Database__InitializeOnStartup: "true"
      Jwt__Key: ${JWT_KEY:?JWT_KEY .env dosyasında tanımlı olmalı}
      Seed__AdminEmail: ${SEED_ADMIN_EMAIL:-admin@pri.local}
      Seed__AdminPassword: ${SEED_ADMIN_PASSWORD:?SEED_ADMIN_PASSWORD .env dosyasında tanımlı olmalı}
      Seed__AdminDisplayName: ${SEED_ADMIN_DISPLAY_NAME:-Admin}
      Cors__AllowedOrigins__0: http://localhost:5173
      PayPal__CredentialStorePath: /var/lib/PRI/paypal-credentials.dat
      DataProtection__KeyRingPath: /var/lib/PRI/dp-keys
    ports:
      - "127.0.0.1:${API_PORT:-5000}:10000"
    volumes:
      - pri_api_data:/var/lib/PRI

volumes:
  pri_pgdata:
  pri_api_data:
